name: Windows build

on:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build T2D-CAD.exe
        run: pyinstaller --noconfirm T2D-CAD.spec

      - name: Add readme
        shell: pwsh
        run: Copy-Item README.md dist/T2D-CAD/BENIOKU.md

      - uses: actions/upload-artifact@v4
        with:
          name: T2D-CAD-windows
          path: dist/T2D-CAD
          retention-days: 30

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/T2D-CAD -DestinationPath T2D-CAD-windows.zip

      - name: Release (only for version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: T2D-CAD-windows.zip
