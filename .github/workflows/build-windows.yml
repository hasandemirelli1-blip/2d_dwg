name: Windows build

on:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build T2D-CAD.exe
        run: pyinstaller --noconfirm T2D-CAD.spec

      - name: Add readme
        shell: pwsh
        run: Copy-Item README.md dist/T2D-CAD/BENIOKU.md

      - name: Bundle ODA File Converter (DWG support)
        continue-on-error: true
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $page = (Invoke-WebRequest -Uri "https://www.opendesign.com/guestfiles/oda_file_converter" -UseBasicParsing -Headers @{ "User-Agent" = "Mozilla/5.0" }).Content
          $links = [regex]::Matches($page, 'href="([^"]*?ODAFileConverter[^"]*?\.msi)"') | ForEach-Object { $_.Groups[1].Value }
          Write-Host "MSI links:"; $links | ForEach-Object { Write-Host "  $_" }
          $url = $links | Where-Object { $_ -match 'amd64|x64' } | Select-Object -First 1
          if (-not $url) { $url = $links | Select-Object -First 1 }
          if (-not $url) { throw "ODA download link not found" }
          $url = $url -replace '&amp;', '&'
          if ($url.StartsWith("/")) { $url = "https://www.opendesign.com$url" }
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile oda.msi -UseBasicParsing -Headers @{ "User-Agent" = "Mozilla/5.0" }
          $target = Join-Path $PWD "dist\T2D-CAD\oda"
          Start-Process msiexec.exe -ArgumentList "/a `"$PWD\oda.msi`" /qn TARGETDIR=`"$target`"" -Wait
          Get-ChildItem $target -Recurse -Filter *.msi | Remove-Item -ErrorAction SilentlyContinue
          $exe = Get-ChildItem $target -Recurse -Filter ODAFileConverter.exe | Select-Object -First 1
          if (-not $exe) { throw "ODAFileConverter.exe not found after extraction" }
          Write-Host "Bundled: $($exe.FullName)"

      - name: DWG round trip test with the bundled converter
        continue-on-error: true
        env:
          T2D_TEST: "1"
        run: python tools/dwg_smoke_test.py dist/T2D-CAD/oda

      - name: Build installer (single setup .exe, desktop shortcut)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe).Source }
          $ver = python -c "import t2dcad; print(t2dcad.__version__)"
          & $iscc "/DAppVersion=$ver" installer\T2D-CAD.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist -Filter *.exe | ForEach-Object { Write-Host "$($_.Name) $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Installer silent install test
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "T2D-CAD-Kurulum-*.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "t2d-install"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /CURRENTUSER /DIR=`"$dir`"" -Wait
          if (-not (Test-Path "$dir\T2D-CAD.exe")) { throw "T2D-CAD.exe not installed" }
          $lnk = Join-Path ([Environment]::GetFolderPath("Desktop")) "T2D-CAD.lnk"
          if (-not (Test-Path $lnk)) { throw "Desktop shortcut missing" }
          Write-Host "Installed OK, shortcut: $lnk"
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait

      - uses: actions/upload-artifact@v4
        with:
          name: T2D-CAD-Kurulum
          path: dist/T2D-CAD-Kurulum-*.exe
          compression-level: 0
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: T2D-CAD-windows
          path: dist/T2D-CAD
          retention-days: 30

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $ver = python -c "import t2dcad; print(t2dcad.__version__)"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Zip for release
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path dist/T2D-CAD -DestinationPath T2D-CAD-windows.zip

      # every push publishes the setup .exe as a Release (tag v<version>, created by the action)
      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: T2D-CAD ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Kurulum:** `T2D-CAD-Kurulum-${{ steps.ver.outputs.version }}.exe` dosyasını indirip çalıştırın.
            Masaüstü ve Başlat menüsü kısayolları otomatik oluşur, yönetici yetkisi gerekmez.
            Kurulumsuz kullanım için: `T2D-CAD-windows.zip`.
          files: |
            dist/T2D-CAD-Kurulum-*.exe
            T2D-CAD-windows.zip
